<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Waiting — Task Master</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="tool">
    <header>
      <p class="label">EVERYDAY TOOL</p>
      <h1>Tasks</h1>
      <p class="subtitle">Track how long your tasks sit waiting, how long they take to complete, and see your overall stats.</p>
    </header>

    <!-- Dashboard Metrics -->
    <section class="dashboard" id="dashboard">
      <div class="metric">
        <span class="metric-label">Completed</span>
        <span class="metric-value" id="statCompleted">0</span>
      </div>
      <div class="metric">
        <span class="metric-label">Avg Wait Time</span>
        <span class="metric-value" id="statAvgWait">--:--</span>
      </div>
      <div class="metric">
        <span class="metric-label">Avg Work Time</span>
        <span class="metric-value" id="statAvgWork">--:--</span>
      </div>
    </section>

    <form id="taskForm" class="task-form">
      <input id="taskInput" type="text" placeholder="Add a task..." maxlength="100" autocomplete="off" required>
      <button type="submit">Add</button>
    </form>

    <p id="storageMessage" class="storage-message" hidden>
      Your browser could not save tasks. They may disappear when you reload.
    </p>

    <div class="actions-bar">
      <button id="clearCompletedBtn" type="button" class="clear-button" hidden>Clear Completed</button>
    </div>

    <section id="taskList" class="task-list" aria-live="polite"></section>
    <p id="emptyMessage" class="empty-message">No tasks yet.</p>
  </main>
  <script src="main.js"></script>
</body>
</html>
